<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva para 1000</title>
    <!-- <title>SEU ACESSO FOI NEGADO</title> -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="LOGO_FORTSUN_PDF (1).png" type="image/x-icon">
</head>
<body>
    <div class="background-pattern"></div>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="mp-logo">
            <img src="LOGO_FORTSUN_PDF (1).png" alt="Fortsun">
        </div>
        <h1>Contagem Regressiva para 1000</h1>
        <!-- <h1>SEU ACESSO FOI NEGADO!</h1> -->

        <div class="countdown" id="countdown">988</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <p class="remaining" id="remaining">Faltam apenas 50 para alcançarmos nossa meta!</p>
        
    </div>

    <script src="script.js"></script>
